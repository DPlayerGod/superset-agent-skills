services:
  postgres:
    image: postgres:15
    container_name: super_postgres
    restart: always
    environment:
      POSTGRES_DB: super_db
      POSTGRES_USER: super_user
      POSTGRES_PASSWORD: super_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  superset:
    build:
      context: .
      dockerfile: superset/Dockerfile
    image: super_dplayergod-superset:6.1.0
    container_name: super_superset
    restart: always
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "super_secret_key_987654321_abc"
      AGENT_GATEWAY_URL: http://claude_gateway:8090
    user: root
    # psycopg2-binary is installed at build time (superset/Dockerfile), so it is
    # deliberately NOT reinstalled here: doing that on every start made a container
    # restart depend on reaching pypi.org, and the whole `&&` chain - and with it
    # Superset - never came up when egress was unavailable.
    entrypoint: >
      /bin/sh -c "
      echo 'Bootstrapping Apache Superset...' &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Super --lastname Admin --email admin@super.com --password admin || true &&
      superset init &&
      /usr/bin/run-server.sh
      "
    volumes:
      - superset_home:/app/superset_home

  claude_gateway:
    build:
      context: .
      dockerfile: claude_gateway/Dockerfile
    image: super_dplayergod-claude-gateway:latest
    container_name: super_claude_gateway
    restart: always
    depends_on:
      - postgres
      - superset
    working_dir: /app
    command: python3 gateway_server.py
    environment:
      # Generate with `claude setup-token` (on a machine logged into a Claude
      # Pro/Max account via `claude login`) - this bills against that account's
      # subscription quota instead of pay-per-token API usage. No
      # ANTHROPIC_BASE_URL here: OAuth subscription auth only works against
      # Anthropic's own endpoint, not a custom API-key proxy.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?Set CLAUDE_CODE_OAUTH_TOKEN in your shell or a .env file before running docker compose up. Generate it with `claude setup-token`.}
      DATABASE_URL: postgresql://super_user:super_pass@postgres:5432/super_db
      MCP_MAX_ROWS: 500
      SUPERSET_URL: http://superset:8088
      # Browser-facing base URL. SUPERSET_URL above is the in-network hostname used
      # for REST calls and does not resolve outside Docker, so links/iframes handed
      # to the browser are built from this one instead. Override when deploying
      # anywhere other than localhost.
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://localhost:8088}
      SUPERSET_ADMIN_USERNAME: admin
      SUPERSET_ADMIN_PASSWORD: admin
      CLAUDE_GATEWAY_PORT: 8090
      # Alias ("sonnet", "opus", "fable") or full model name
      # ("claude-haiku-4-5-20251001"). Leave unset to use the CLI's own default.
      CLAUDE_GATEWAY_MODEL: ${CLAUDE_GATEWAY_MODEL:-}
    volumes:
      - claude_home:/home/node/.claude

volumes:
  postgres_data:
  superset_home:
  claude_home:
